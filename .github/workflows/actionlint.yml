name: actionlint
# Epic 1.6 .9.3 — lint every workflow (incl. the reusable vps-deploy.yml) so a smoke/deploy step name
# or a shellcheck defect is caught before it ships. Runs on PRs + pushes that touch workflows.
on:
  push:
    paths: [".github/workflows/**", "tests/**", "README.md"]
  pull_request:
    paths: [".github/workflows/**", "tests/**", "README.md"]
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test pinned SSH transport with disposable local keys
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          python3 -m unittest discover -s tests -v
      - name: Run actionlint (self-hosted binary, pinned)
        run: |
          set -euo pipefail
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
